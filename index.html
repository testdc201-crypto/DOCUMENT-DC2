<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOCUMENT DC2 (Realtime)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bd:#d5d9de;--mt:#666;--bg:#f3f5f7}
*{box-sizing:border-box}
body{margin:0;font:14px Sarabun,Tahoma,sans-serif;color:#222;background:var(--bg);display:flex;min-height:100vh}
nav{width:200px;background:#fff;border-right:1px solid var(--bd);flex:none;padding-top:8px}
nav a{display:block;padding:11px 16px;color:#333;cursor:pointer;font-weight:600;font-size:13px;border-left:4px solid transparent}
nav a.on{background:#eceff2;border-left-color:#444}
.wrap{flex:1;min-width:0}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:.06em}
.sp{flex:1}
#hdr-st{padding:3px 10px;font-weight:700;font-size:12px;border:1px solid}
.ok{color:#2e7d4f}.bad{color:#b02a2a}
main{padding:16px}
button,input,select{font:inherit}
button{border:1px solid #888;background:#fff;padding:6px 12px;cursor:pointer}
button.pri{background:#3a4047;color:#fff;border-color:#3a4047}
button:disabled{opacity:.4;cursor:default}
input,select{border:1px solid #aaa;padding:6px 8px;background:#fff;max-width:100%}
.card{background:#fff;border:1px solid var(--bd);padding:14px;margin-bottom:14px}
.card h3,.cab h3{margin:0 0 10px;font-size:14px;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--bd);padding:10px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--mt)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.mt{color:var(--mt)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:#eceff2;font-size:12px}
tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f0f3f5}
.chip{display:inline-block;border:1px solid #aaa;padding:3px 8px;margin:2px;cursor:pointer;font-size:12px}
.bb{height:18px;background:#6b7580;margin:4px 0}
.found{font-weight:700;font-size:16px;margin:6px 0}
.cab{margin-bottom:18px}.cab small{margin-left:10px;color:var(--mt);font-weight:400}
.frame{background:#e4e7ea;border:7px solid #aeb4ba;padding:10px 6px 2px}
.shelf{margin-bottom:10px}
.tag{font-size:11px;font-weight:700;color:var(--mt);padding:0 8px 3px;letter-spacing:.08em}
.row{display:flex;gap:3px;align-items:flex-end;padding:8px 8px 0;background:#cfd4d9}
.plank{height:10px;background:linear-gradient(#b9bfc5,#98a0a7)}
.f{flex:1 1 0;min-width:0;height:var(--fh);background:#fff;border:1px solid #777;border-left:6px solid var(--c);border-right:6px solid var(--c);position:relative;display:flex;flex-direction:column;cursor:pointer}
.f:hover{background:#f4f8fb}
.lv{height:24px;font-size:9px;color:#555;border-bottom:1px solid #999;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.lv.sec{color:#c0283c;font-weight:700}
.nm{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px 0}
.nm span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;color:#555;text-align:center;max-height:100%;line-height:1.1}
.no{height:26px;border-top:1px solid #999;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.dot{position:absolute;top:4px;right:3px;width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.grn{background:#2e9d57}.yel{background:#e0b100}.red{background:#d03a3a}.g0{background:#9aa0a6}
.f.hit{outline:4px solid #e67e00;outline-offset:2px;z-index:2;box-shadow:0 0 10px rgba(230,126,0,.6)}
.badge{padding:2px 8px;color:#fff;font-size:12px;font-weight:700}
#ov1,#ov2{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:10;padding:12px}
#ov2{z-index:20}
.dlg{background:#fff;border:1px solid #888;padding:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.dlg.wide{max-width:920px}
.dlg label,.fm label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mt)}
.dlg input,.dlg select,.fm input,.fm select{width:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin:10px 0}.kv div{border:1px solid var(--bd);padding:5px 8px}.kv small{display:block;color:var(--mt)}
.fm{max-width:420px}
#toast{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:6px}
#toast div{background:#333;color:#fff;padding:9px 14px;border-left:5px solid #2e9d57;max-width:360px}#toast div.e{border-color:#d03a3a}
#rt-status{font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;margin-left:12px;display:inline-flex;align-items:center;gap:6px}
#rt-status::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
#rt-status.on{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
#rt-status.off{background:#ffebee;color:#b71c1c;border:1px solid #ef9a9a}
#rt-status.connecting{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
</style>
</head>
<body>
<nav>
<a data-v="dash" onclick="go('dash')">DASHBOARD</a>
<a data-v="cab" onclick="go('cab')">DOCUMENT CABINET</a>
<a data-v="search" onclick="go('search')">SEARCH DOCUMENT</a>
<a data-v="data" onclick="go('data')">DATA MANAGEMENT</a>
<a data-v="bk" onclick="go('bk')">BACKUP &amp; RESTORE</a>
<a data-v="set" onclick="go('set')">SETTINGS</a>
<div class="bar" style="padding:8px 12px">
<button id="lEN" onclick="setLang('en')">EN</button>
<button id="lTH" onclick="setLang('th')">TH</button>
</div>
</nav>
<div class="wrap">
<header>
<h1 id="proj">DOCUMENT DC2</h1>
<span id="rt-status" class="connecting">CONNECTING...</span>
<span class="sp"></span>
<span id="hdr-st" class="ok">SAVED</span>
<button id="bSave" class="pri" onclick="save()">SAVE CHANGES</button>
<button id="bDisc" onclick="discard()">DISCARD CHANGES</button>
</header>
<main id="main"></main>
</div>
<div id="ov1"></div><div id="ov2"></div><div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ========== SUPABASE CONFIG ========== */
const SUPABASE_URL = 'https://wiwqtsqolnuzxkuqzono.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SRAjKxs3jaJXg5GRHANLtg_ySbZxDyM';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ========== CORE ========== */
const $ = i => document.getElementById(i);
const E = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CL = o => JSON.parse(JSON.stringify(o));
const SH = {T:'TOP SHELF',M:'MIDDLE SHELF',B:'BOTTOM SHELF'};
const LV = {C:'CONFIDENTIAL',S:'SECRET','':''};
const R = (n,a) => Array(n).fill(a);
const MO = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const L = {
  1:{
    T:[['ISO 9001','C'],['ISO 14001','C'],['ISO 45001','C'],['Training Record','C'],['Training Record','C'],['Risk assesment',''],['ISM&PDPA','C'],['Request sheet chang the production plan','']],
    M:[['Pilot Follow',''],...R(7,['MASS Follow','C'])],
    B:[['Monthly follow Pac(Melshi)','C'],['Monthly follow Pac(Melwa)','C'],['Monthly follow Rac','C'],['Monthly Pilot no delay no rework','C'],['KNOW HOW',''],['Working Manual',''],['Pilot before MPS',''],['Invoice DC2','']]
  },
  2:{
    T:[...R(3,['TECHNICAL REPORT','C']),...R(7,['DR3&MPJ','S'])],
    M:R(10,['DR3&MPJ','S']),
    B:[['MINUTE MEETING','S'],['MINUTE MEETING','S'],['MOLD & DIE GO',''],['MODIFY MOLD & DIE GO','S'],['Why Why analysis',''],['Summary problem pilot',''],['List check preventive',''],['Business trip report',''],['Fix production line assy',''],['Fix production line assy','']]
  }
};

function fresh(){
  const f=[];
  for(const c in L) for(const s of 'TMB') L[c][s].forEach((a,i)=>f.push({
    id:`C${c}-${s}-${String(i+1).padStart(2,'0')}`,
    cab:+c, shelf:s, no:i+1, name:a[0], level:LV[a[1]], cap:null, color:null, docs:[]
  }));
  return {ts:0, settings:{name:'DOCUMENT DC2',near:61,full:91,fmt:'DD/MM/YYYY',color:'#3f8ed0',bak:true}, folders:f};
}

let saved = fresh();
let W = CL(saved);
let V='dash', CF=0, ZM=1, Q='', HIT=new Set(), editing=false, curF=null, DM={}, askFn=null, IMP=null;
let connected = false;

const dirty = () => JSON.stringify(W) !== JSON.stringify(saved);

const TR = {
  en:{dash:'DASHBOARD',cab:'DOCUMENT CABINET',search:'SEARCH DOCUMENT',data:'DATA MANAGEMENT',bk:'BACKUP & RESTORE',set:'SETTINGS',save:'SAVE CHANGES',disc:'DISCARD CHANGES',sav:'SAVED',uns:'UNSAVED CHANGES'},
  th:{dash:'แดชบอร์ด',cab:'ตู้เอกสาร',search:'ค้นหาเอกสาร',data:'จัดการข้อมูล',bk:'สำรองและกู้คืนข้อมูล',set:'ตั้งค่า',save:'บันทึกการแก้ไข',disc:'ยกเลิกการแก้ไข',sav:'บันทึกแล้ว',uns:'มีการแก้ไขที่ยังไม่บันทึก'}
};
let LG = 'en';
try{ LG = localStorage.getItem('dc2_lang')==='th'?'th':'en'; }catch(e){}
const t = k => TR[LG][k];

function setLang(l){ LG=l; try{localStorage.setItem('dc2_lang',l)}catch(e){} render(); }
function applyLang(){
  document.querySelectorAll('nav a').forEach(a=>a.textContent=t(a.dataset.v));
  $('bSave').textContent=t('save');
  $('bDisc').textContent=t('disc');
  $('lEN').className = LG=='en'?'pri':'';
  $('lTH').className = LG=='th'?'pri':'';
}

const cf = () => W.folders.find(x=>x.id==curF);
const allDocs = (X=W) => X.folders.flatMap(f=>f.docs.map(d=>({d,f})));
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

function fd(d){
  if(!d) return '';
  const [y,m,x] = d.split('-');
  const f = W.settings.fmt;
  return f=='YYYY-MM-DD' ? d : f=='DD MMM YYYY' ? `${x} ${MO[m-1]} ${y}` : `${x}/${m}/${y}`;
}

function st(f,s=W.settings){
  const n=f.docs.length, c=f.cap;
  if(!c) return {k:'g0',t:'NOT SET'};
  const p = n/c*100;
  if(n>=c || (s.full!=null && p>=s.full)) return {k:'red',t:'FULL'};
  if(s.near!=null && p>=s.near) return {k:'yel',t:'NEAR FULL'};
  return {k:'grn',t:'AVAILABLE'};
}

function toast(m,bad){
  const d=document.createElement('div');
  d.textContent=m;
  if(bad) d.className='e';
  $('toast').appendChild(d);
  setTimeout(()=>d.remove(),4500);
}

const show = (o,h) => { $(o).innerHTML=h; $(o).style.display='flex'; };
const hide = o => { $(o).style.display='none'; $(o).innerHTML=''; };

function ask(m,fn){
  askFn=fn;
  show('ov2',`<div class="dlg"><h3>DELETE CONFIRMATION</h3><p>${E(m)}</p><div class="bar"><button class="pri" onclick="hide('ov2');askFn()">YES</button><button onclick="hide('ov2')">NO</button></div></div>`);
}

function updateStatus(state){
  const el = $('rt-status');
  if(!el) return;
  if(state === 'live'){
    el.textContent = 'LIVE · ONLINE';
    el.className = 'on';
    connected = true;
  } else if(state === 'connecting'){
    el.textContent = 'CONNECTING...';
    el.className = 'connecting';
  } else {
    el.textContent = 'OFFLINE';
    el.className = 'off';
    connected = false;
  }
}

/* ========== REALTIME LOAD / SAVE ========== */
async function loadFromCloud(){
  updateStatus('connecting');
  try{
    const {data, error} = await sb.from('dc2_data').select('data').eq('id','main').maybeSingle();
    if(error) throw error;
    if(data && data.data && data.data.folders && data.data.folders.length===54){
      saved = data.data;
      W = CL(saved);
      updateStatus('live');
      toast('Connected to cloud · Realtime ready');
    } else {
      const init = fresh();
      const {error: e2} = await sb.from('dc2_data').upsert({id:'main', data:init, updated_at:new Date().toISOString()});
      if(e2) throw e2;
      saved = init;
      W = CL(saved);
      updateStatus('live');
      toast('Initialized cloud data · Realtime ready');
    }
  }catch(e){
    console.error('Cloud error:', e);
    updateStatus('offline');
    toast('Cloud connection failed: ' + (e.message || e), 1);
    try{
      const a = JSON.parse(localStorage.getItem('dc2_saved'));
      if(a && a.folders && a.folders.length===54){ saved=a; W=CL(saved); }
    }catch(x){}
  }
  render();
}

async function save(){
  const e = validateAll();
  if(e){ toast(e,1); return false; }
  const old = W.ts;
  W.ts = Date.now();
  try{
    const {error} = await sb.from('dc2_data').upsert({
      id: 'main',
      data: W,
      updated_at: new Date().toISOString()
    });
    if(error) throw error;
    saved = CL(W);
    try{ localStorage.setItem('dc2_saved', JSON.stringify(W)); }catch(x){}
    toast('SAVE SUCCESSFULLY · Synced to all devices');
    render();
    return true;
  }catch(x){
    W.ts = old;
    toast('SAVE FAILED: ' + (x.message || x), 1);
    return false;
  }
}

function discard(){
  const go = ()=>{ W=CL(saved); editing=false; render(); toast('CHANGES DISCARDED'); };
  dirty() ? ask('Discard all unsaved changes and restore the last saved data?', go) : toast('NO UNSAVED CHANGES');
}

addEventListener('beforeunload', e => { if(dirty()){ e.preventDefault(); e.returnValue=''; } });

function startRealtime(){
  const channel = sb.channel('dc2-realtime')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'dc2_data',
      filter: 'id=eq.main'
    }, (payload) => {
      if(payload.new && payload.new.data){
        const remote = payload.new.data;
        if(JSON.stringify(remote) === JSON.stringify(saved)) return;
        saved = remote;
        W = CL(saved);
        editing = false;
        curF = null;
        hide('ov1'); hide('ov2');
        render();
        toast('🔄 Updated from another device');
      }
    })
    .subscribe((status, err) => {
      console.log('Realtime status:', status, err);
      if(status === 'SUBSCRIBED'){
        updateStatus('live');
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        updateStatus('offline');
        toast('Realtime connection issue', 1);
      }
    });
}

/* ========== VALIDATION ========== */
function validateAll(){
  const seen=new Set(), ids=new Set(), s=W.settings;
  if(s.near!=null && s.full!=null && s.near>=s.full) return 'Near-full threshold must be lower than full threshold';
  for(const f of W.folders){
    if(ids.has(f.id)) return 'Duplicate Folder ID '+f.id;
    ids.add(f.id);
    if(!f.name.trim()) return 'Folder name missing: '+f.id;
    if(f.cap!=null && f.cap < f.docs.length) return 'Capacity lower than document count: '+f.id;
    if(f.docs.length && !f.cap) return 'FOLDER CAPACITY NOT SET: '+f.id;
    for(const d of f.docs){
      if(!d.code || !d.date) return 'Incomplete document in '+f.id;
      const k = d.code.toLowerCase();
      if(seen.has(k)) return 'DOCUMENT CODE ALREADY EXISTS: '+d.code;
      seen.add(k);
    }
  }
  return '';
}

/* ========== VIEWS ========== */
function go(v){ V=v; if(v!='search') HIT=new Set(); render(); scrollTo(0,0); }

function render(){
  const d = dirty();
  $('hdr-st').className = d ? 'bad' : 'ok';
  $('hdr-st').textContent = d ? t('uns') : t('sav');
  applyLang();
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v==V));
  $('proj').textContent = W.settings.name;
  $('main').innerHTML = VW[V]();
  if(curF) fmodal();
}

function fh(f){
  const s=st(f), n=f.name.length;
  return `<div class="f${HIT.has(f.id)?' hit':''}" data-id="${f.id}" style="--c:${f.color||W.settings.color}" title="${E(f.name)} - ${s.t}">
    <i class="dot ${s.k}"></i>
    <div class="lv ${f.level=='SECRET'?'sec':''}">${E(f.level)||'&nbsp;'}</div>
    <div class="nm"><span style="font-size:${n>24?11:n>14?13:16}px">${E(f.name)}</span></div>
    <div class="no">NO.${f.no}</div>
  </div>`;
}

function ctl(){
  return `<div class="bar"><b>VIEW</b>` +
    [[0,'ALL CABINETS'],[1,'CABINET 1'],[2,'CABINET 2']].map(a=>`<button class="${CF==a[0]?'pri':''}" onclick="CF=${a[0]};render()">${a[1]}</button>`).join('') +
    `<span class="sp"></span><button onclick="ZM=Math.max(.6,ZM-.1);render()">ZOOM OUT</button><button onclick="ZM=Math.min(1.6,ZM+.1);render()">ZOOM IN</button></div>
    <div class="bar mt"><i class="dot grn" style="position:static;display:inline-block"></i> Available <i class="dot yel" style="position:static;display:inline-block"></i> Near full <i class="dot red" style="position:static;display:inline-block"></i> Full <i class="dot g0" style="position:static;display:inline-block"></i> Not set</div>`;
}

function cabs(){
  const cs = CF ? [CF] : [1,2];
  return `<div style="--fh:${190*ZM}px">` +
    cs.map(c => {
      const fs = W.folders.filter(f=>f.cab==c);
      return `<section class="cab"><h3>CABINET ${c}<small>${fs.length} FOLDERS</small></h3><div class="frame">` +
        'TMB'.split('').map(s => `<div class="shelf"><div class="tag">${SH[s]}</div><div class="row">${fs.filter(f=>f.shelf==s).map(fh).join('')}</div><div class="plank"></div></div>`).join('') +
        `</div></section>`;
    }).join('') + '</div>';
}

const sbox = () => `<div class="card"><h3>SEARCH DOCUMENT CODE</h3><div class="bar"><input id="sq" style="width:320px" value="${E(Q)}" placeholder="Document code" onkeydown="if(event.key=='Enter')sub()"><button class="pri" onclick="sub()">SEARCH</button></div></div>`;

const chips = (k,t) => {
  const a = W.folders.filter(f=>st(f).k==k);
  return `<div class="card"><h3>${t} (${a.length})</h3>` + (a.length ? a.map(f=>`<span class="chip" data-id="${f.id}">C${f.cab} ${f.shelf} NO.${f.no} ${E(f.name)}</span>`).join('') : '<span class="mt">None</span>') + '</div>';
};

const VW = {};

VW.dash = () => {
  const F=W.folders, n=F.reduce((a,f)=>a+f.docs.length,0), c=k=>F.filter(f=>st(f).k==k).length;
  const per=[1,2].map(x=>F.filter(f=>f.cab==x).reduce((a,f)=>a+f.docs.length,0)), mx=Math.max(1,...per);
  const cards=[['CABINETS',2],['SHELVES',6],['FOLDERS',F.length],['DOCUMENTS',n],['GREEN',c('grn')],['YELLOW',c('yel')],['RED',c('red')],['NOT SET',c('g0')],['EMPTY FOLDERS',F.filter(f=>!f.docs.length).length]];
  return `<div class="stats">${cards.map(a=>`<div class="stat"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('')}</div>${sbox()}${ctl()}${cabs()}
  <div class="card"><h3>DOCUMENTS BY CABINET</h3>${per.map((p,i)=>`<div>CABINET ${i+1}: ${p}<div class="bb" style="width:${p/mx*100}%"></div></div>`).join('')}</div>${chips('yel','NEAR FULL FOLDERS')}${chips('red','FULL FOLDERS')}${chips('g0','CAPACITY NOT SET')}`;
};

VW.cab = () => ctl()+cabs();

function sub(){
  Q = $('sq').value.trim();
  if(!Q){ toast('ENTER DOCUMENT CODE',1); return; }
  const r = allDocs().filter(x=>x.d.code.toLowerCase().includes(Q.toLowerCase()));
  const cs = new Set(r.map(x=>x.f.cab));
  CF = cs.size==1 ? [...cs][0] : 0;
  V='search';
  render();
  if(!r.length) toast('DOCUMENT NOT FOUND',1);
  else setTimeout(()=>{ const e=document.querySelector('.f.hit'); if(e) e.scrollIntoView({block:'center',behavior:'smooth'}); },60);
}

VW.search = () => {
  const r = Q ? allDocs().filter(x=>x.d.code.toLowerCase().includes(Q.toLowerCase())) : [];
  HIT = new Set(r.map(x=>x.f.id));
  let h = sbox();
  if(Q){
    h += r.length ? `<div class="card"><div class="found">DOCUMENT FOUND (${r.length})</div><table><tr><th>Document Code</th><th>Document Date</th><th>Cabinet</th><th>Shelf</th><th>Folder</th><th>Folder Name</th><th>Confidentiality</th></tr>${r.map(x=>`<tr data-id="${x.f.id}"><td>${E(x.d.code)}</td><td>${fd(x.d.date)}</td><td>${x.f.cab}</td><td>${SH[x.f.shelf]}</td><td>NO.${x.f.no}</td><td>${E(x.f.name)}</td><td>${E(x.f.level)||'Blank'}</td></tr>`).join('')}</table></div>` : '<div class="card"><div class="found">DOCUMENT NOT FOUND</div></div>';
  }
  return h + ctl() + cabs();
};

const sel = (id,opts,cur) => `<select onchange="DM.${id}=this.value;render()">${opts.map(o=>`<option value="${E(o[0])}" ${cur==o[0]?'selected':''}>${E(o[1])}</option>`).join('')}</select>`;

VW.data = () => {
  const q = (DM.q||'').toLowerCase();
  let r = allDocs().filter(x =>
    (!DM.cab || x.f.cab==DM.cab) &&
    (!DM.shelf || x.f.shelf==DM.shelf) &&
    (!DM.fid || x.f.id==DM.fid) &&
    (!DM.lv || x.f.level==(DM.lv=='Blank'?'':DM.lv)) &&
    (!DM.from || x.d.date>=DM.from) &&
    (!DM.to || x.d.date<=DM.to) &&
    (!q || x.d.code.toLowerCase().includes(q))
  );
  const sum = [1,2].flatMap(c=>'TMB'.split('').map(s=>`<tr><td>${c}</td><td>${SH[s]}</td><td>${W.folders.filter(f=>f.cab==c&&f.shelf==s).reduce((a,f)=>a+f.docs.length,0)}</td></tr>`)).join('');
  return `<div class="card"><h3>FILTERS</h3><div class="bar">${sel('cab',[['','All cabinets'],['1','Cabinet 1'],['2','Cabinet 2']],DM.cab)}${sel('shelf',[['','All shelves'],['T','TOP'],['M','MIDDLE'],['B','BOTTOM']],DM.shelf)}${sel('fid',[['','All folders'],...W.folders.map(f=>[f.id,`C${f.cab} ${f.shelf} NO.${f.no} ${f.name}`])],DM.fid)}${sel('lv',[['','All levels'],['Blank','Blank'],['CONFIDENTIAL','CONFIDENTIAL'],['SECRET','SECRET']],DM.lv)}
  <input type="date" value="${DM.from||''}" onchange="DM.from=this.value;render()"><input type="date" value="${DM.to||''}" onchange="DM.to=this.value;render()"><input placeholder="Search code" value="${E(DM.q||'')}" onchange="DM.q=this.value;render()"><button onclick="DM={};render()">CLEAR</button><button class="pri" onclick="chk()">CHECK DATA</button></div></div>
  <div class="card"><h3>DOCUMENTS (${r.length} of ${allDocs().length})</h3><table><tr><th>Document Code</th><th>Date</th><th>Cabinet</th><th>Shelf</th><th>Folder</th><th>Level</th><th>Action</th></tr>${r.map(x=>`<tr><td>${E(x.d.code)}</td><td>${fd(x.d.date)}</td><td>${x.f.cab}</td><td>${SH[x.f.shelf]}</td><td>NO.${x.f.no} ${E(x.f.name)}</td><td>${E(x.f.level)||'Blank'}</td><td><button onclick="editDoc('${x.f.id}','${x.d.id}')">EDIT</button> <button onclick="delDoc('${x.f.id}','${x.d.id}')">DELETE</button></td></tr>`).join('')||'<tr><td colspan="7">No documents</td></tr>'}</table></div>
  <div class="card"><h3>COUNT BY SHELF</h3><table><tr><th>Cabinet</th><th>Shelf</th><th>Documents</th></tr>${sum}</table><details><summary>Count by folder</summary><table><tr><th>Folder ID</th><th>Name</th><th>Documents</th><th>Capacity</th></tr>${W.folders.map(f=>`<tr data-id="${f.id}"><td>${f.id}</td><td>${E(f.name)}</td><td>${f.docs.length}</td><td>${f.cap==null?'NOT SET':f.cap}</td></tr>`).join('')}</table></details></div>`;
};

function chk(){
  const m={},inc=[],nc=[];
  allDocs().forEach(x=>{
    const k=x.d.code.trim().toLowerCase();
    (m[k]=m[k]||[]).push(x);
    if(!x.d.code.trim()||!/^\d{4}-\d\d-\d\d$/.test(x.d.date||'')) inc.push(x);
  });
  W.folders.forEach(f=>{ if(f.docs.length && !f.cap) nc.push(f); });
  const du = Object.values(m).filter(a=>a.length>1);
  show('ov2',`<div class="dlg"><h3>DATA CHECK</h3><p>Duplicate codes: <b>${du.length}</b>${du.map(a=>'<br>'+E(a[0].d.code)+' in '+a.map(x=>x.f.id).join(', ')).join('')}</p><p>Incomplete documents: <b>${inc.length}</b>${inc.map(x=>'<br>'+x.f.id+' '+E(x.d.code)).join('')}</p><p>Folders with documents but no capacity: <b>${nc.length}</b></p><button onclick="hide('ov2')">CLOSE</button></div>`);
}

VW.bk = () => {
  return `<div class="card"><h3>EXPORT</h3><p class="mt">Last saved: ${saved.ts?new Date(saved.ts).toLocaleString():'never'}</p><div class="bar"><button class="pri" onclick="expX()">EXPORT EXCEL</button></div></div>
  <div class="card"><h3>REALTIME STATUS</h3><p>Connection: <b>${connected ? 'LIVE · ONLINE' : 'OFFLINE'}</b></p><p class="mt">When you press SAVE CHANGES, data is pushed to the cloud and other open devices will update automatically.</p></div>`;
};

VW.set = () => {
  const s = W.settings;
  return `<div class="card"><h3>SETTINGS</h3><div class="fm">
  <label>Project name</label><input id="s-name" value="${E(s.name)}">
  <label>Near-full threshold (%)</label><input id="s-near" type="number" min="1" max="100" value="${s.near==null?'':s.near}" placeholder="NOT SET">
  <label>Full threshold (%)</label><input id="s-full" type="number" min="1" max="100" value="${s.full==null?'':s.full}" placeholder="NOT SET">
  <label>Date format</label><select id="s-fmt">${['DD/MM/YYYY','YYYY-MM-DD','DD MMM YYYY'].map(x=>`<option ${s.fmt==x?'selected':''}>${x}</option>`).join('')}</select>
  <label>Default folder color</label><input id="s-col" type="color" value="${s.color}">
  </div><div class="bar"><button class="pri" onclick="saveSet()">SAVE</button><button onclick="render()">CANCEL</button></div></div>`;
};

function saveSet(){
  const nm = $('s-name').value.trim();
  if(!nm) return toast('PROJECT NAME REQUIRED',1);
  const g = i => { const v=$(i).value.trim(); if(v==='') return null; const n=+v; return Number.isInteger(n)&&n>=1&&n<=100?n:NaN; };
  const a=g('s-near'), b=g('s-full');
  if(Number.isNaN(a)||Number.isNaN(b)) return toast('THRESHOLD MUST BE 1-100',1);
  if(a!=null && b!=null && a>=b) return toast('NEAR must be lower than FULL',1);
  Object.assign(W.settings,{name:nm,near:a,full:b,fmt:$('s-fmt').value,color:$('s-col').value});
  save();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-id]');
  if(t) openF(t.dataset.id);
});

function openF(id){ curF=id; editing=false; fmodal(); }

function fmodal(){
  const f = cf();
  if(!f) return;
  const s = st(f);
  const col = {grn:'#2e9d57',yel:'#b38f00',red:'#d03a3a',g0:'#7d838a'}[s.k];
  const kv = (a,b) => `<div><small>${a}</small>${b}</div>`;
  const form = editing ? `<div class="card fm" style="max-width:none"><h3>EDIT FOLDER</h3>
    <label>Folder Name</label><input id="ef-name" value="${E(f.name)}">
    <label>Folder Number</label><input id="ef-no" type="number" min="1" value="${f.no}">
    <label>Confidentiality</label><select id="ef-lv">${[['','Blank'],['CONFIDENTIAL','CONFIDENTIAL'],['SECRET','SECRET']].map(o=>`<option value="${o[0]}" ${f.level==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
    <label>MAXIMUM CAPACITY</label><input id="ef-cap" type="number" min="1" value="${f.cap==null?'':f.cap}" placeholder="NOT SET">
    <label>Color</label><input id="ef-col" type="color" value="${f.color||W.settings.color}">
  </div>` : '';
  show('ov1',`<div class="dlg wide"><h3 style="font-size:18px">${E(f.name)} <span class="badge" style="background:${col}">${s.t}</span></h3>
  <div class="kv">${kv('Cabinet',f.cab)}${kv('Shelf',SH[f.shelf])}${kv('ID',f.id)}${kv('NO.',f.no)}${kv('Docs',f.docs.length)}${kv('Capacity',f.cap==null?'NOT SET':f.cap)}</div>${form}
  <div class="bar"><button class="pri" onclick="addDoc()">ADD DOCUMENT</button><button onclick="editF()">EDIT FOLDER</button><button class="pri" onclick="saveF()">SAVE</button><button onclick="cancelF()">CANCEL</button><span class="sp"></span><button onclick="closeF()">BACK</button></div>
  <table><tr><th>#</th><th>Code</th><th>Date</th><th>Action</th></tr>${f.docs.map((d,i)=>`<tr><td>${i+1}</td><td>${E(d.code)}</td><td>${fd(d.date)}</td><td><button onclick="editDoc('${f.id}','${d.id}')">EDIT</button> <button onclick="delDoc('${f.id}','${d.id}')">DELETE</button></td></tr>`).join('')||'<tr><td colspan="4">No documents</td></tr>'}</table></div>`);
}

function editF(){ editing=true; fmodal(); }
function closeF(){ curF=null; editing=false; hide('ov1'); render(); }
function cancelF(){ editing=false; dirty()?discard():fmodal(); }

function saveF(){
  const f=cf();
  if(editing){
    const nm=$('ef-name').value.trim(), no=+$('ef-no').value, cp=$('ef-cap').value.trim(), lv=$('ef-lv').value;
    if(!nm) return toast('FOLDER NAME REQUIRED',1);
    if(!Number.isInteger(no)||no<1) return toast('INVALID FOLDER NUMBER',1);
    if(W.folders.some(x=>x!==f && x.cab==f.cab && x.shelf==f.shelf && x.no==no)) return toast('FOLDER NUMBER EXISTS',1);
    let c=null;
    if(cp!==''){ c=+cp; if(!Number.isInteger(c)||c<1) return toast('INVALID CAPACITY',1); if(c<f.docs.length) return toast('CAPACITY TOO LOW',1); }
    if(c==null && f.docs.length) return toast('CANNOT CLEAR CAPACITY WITH DOCS',1);
    Object.assign(f,{name:nm,no,level:lv,cap:c,color:$('ef-col').value});
    editing=false;
  }
  save();
}

const dupCode = (c,ex) => allDocs().some(x => x.d.id!=ex && x.d.code.toLowerCase()==c.toLowerCase());

function addDoc(){
  const f=cf();
  if(!f.cap){ toast('Set capacity first (EDIT FOLDER)',1); return; }
  if(f.docs.length>=f.cap){ toast('FOLDER IS FULL',1); return; }
  show('ov2',`<div class="dlg"><h3>ADD DOCUMENT</h3><label>Code</label><input id="dc"><label>Date</label><input id="dd" type="date"><div class="bar"><button class="pri" onclick="okAdd()">ADD</button><button onclick="hide('ov2')">CANCEL</button></div></div>`);
}

function okAdd(){
  const f=cf(), c=$('dc').value.trim(), d=$('dd').value;
  if(!c||!d) return toast('Code and Date required',1);
  if(dupCode(c)) return toast('CODE ALREADY EXISTS',1);
  f.docs.push({id:uid(),code:c,date:d});
  hide('ov2'); render();
  toast('Added · press SAVE to sync');
}

function editDoc(fid,did){
  const d = W.folders.find(f=>f.id==fid).docs.find(x=>x.id==did);
  show('ov2',`<div class="dlg"><h3>EDIT</h3><label>Code</label><input id="dc" value="${E(d.code)}"><label>Date</label><input id="dd" type="date" value="${d.date}"><div class="bar"><button class="pri" onclick="okEdit('${fid}','${did}')">OK</button><button onclick="hide('ov2')">CANCEL</button></div></div>`);
}

function okEdit(fid,did){
  const d = W.folders.find(f=>f.id==fid).docs.find(x=>x.id==did);
  const c=$('dc').value.trim(), dt=$('dd').value;
  if(!c||!dt) return toast('Required',1);
  if(dupCode(c,did)) return toast('CODE EXISTS',1);
  d.code=c; d.date=dt;
  hide('ov2'); render();
  toast('Updated · press SAVE to sync');
}

function delDoc(fid,did){
  const f = W.folders.find(f=>f.id==fid);
  const d = f.docs.find(x=>x.id==did);
  ask('Delete '+d.code+'?', ()=>{ f.docs = f.docs.filter(x=>x.id!=did); render(); toast('Deleted · press SAVE to sync'); });
}

function expX(){
  if(!window.XLSX){ toast('Excel not loaded',1); return; }
  const a=[];
  saved.folders.forEach(f=>f.docs.forEach(d=>a.push({'Document Code':d.code,'Document Date':d.date,'Cabinet':f.cab,'Shelf':SH[f.shelf],'Folder ID':f.id,'Folder Name':f.name})));
  const ws = XLSX.utils.json_to_sheet(a);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'DOCS');
  XLSX.writeFile(wb,'DOCUMENT_DC2.xlsx');
  toast('Exported');
}

/* START */
loadFromCloud().then(() => {
  startRealtime();
});
</script>
</body>
</html>
